    s += `</div><div class="row" style="margin-top:16px"><button class="btn primary" data-act="close">Save</button><button class="btn" style="color:var(--red)" data-act="se-undo">Undo this set</button></div></div></div>`;
    return s;
  }

  function entryName(x) {
    const e = getEx(x.id), p = prefs.ex[x.id] || {};
    if (!e) return 'Removed exercise';
    return x.v === 'a' && e.alt ? (p.aname || e.alt.name) : (p.name || e.name);
  }
  function dayLogHTML() {
    const start = ui.dayLog, end = start + 864e5;
    const ses = hist.sessions.filter(x => x.t >= start && x.t < end);
    const title = new Date(start).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    let s = `<div class="overlay" data-act="close-bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div>
      <div class="hd"><div class="grow"><div class="lbl">Logged workouts</div><h2>${esc(title)}</h2></div><button class="iconbtn" data-act="close" aria-label="Close">${ICON.close}</button></div>`;
    if (!ses.length) {
      const pl = forecast(120)[start];
      if (pl) s += `<div class="blocker d-${DAY[pl].color}" style="margin-top:12px"><p>Planned: <b>${esc(DAY[pl].name)}</b></p>${start === dayStart(Date.now()) ? `<button class="btn primary" data-act="open-day" data-day="${pl}">Start ${esc(DAY[pl].name)}</button>` : '<p class="muted" style="margin:0;font-size:13px">Changes automatically if you train a different day first.</p>'}</div>`;
      else s += `<p class="empty" style="margin-top:12px">${start > dayStart(Date.now()) ? 'Rest day.' : 'Nothing logged on this day.'}</p>`;
    }
    ses.forEach(x => {
      const d = DAY[x.day] || { name: x.day, color: 'steel' };
      const ents = entriesOf(x.t);
      s += `<section class="logday d-${d.color}"><h3><i class="dot"></i>${esc(d.name)} <span class="muted" style="font-size:13px;font-weight:600;text-transform:none">${new Date(x.t).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })} · ${x.min} min</span></h3><ul class="histlist">`;
      ents.forEach(en => {
        const val = en.k === 'time' ? en.m + ' min' : (entrySetsTxt(en) || fmtW(entryVal(en)) + ' ' + shortU(en.k || 'kg') + ' · ' + en.d + '/' + en.n + ' sets');
        s += `<li style="align-items:center;gap:8px"><span style="min-width:0">${esc(entryName(en))}<br><small class="muted num">${val}</small></span><button class="rmbtn" data-act="del-entry" data-id="${en.id}" data-t="${en.t}" data-v="${en.v}" aria-label="Remove ${esc(entryName(en))} from this day">Remove</button></li>`;
      });
      s += `</ul><div class="row" style="margin-top:10px">` + (ui.confirmDel === x.t
        ? `<button class="btn" data-act="del-session-yes" data-t="${x.t}" style="color:var(--red)">Yes, delete this workout</button><button class="btn" data-act="del-session-no">Keep it</button>`
        : `<button class="btn" data-act="del-session" data-t="${x.t}">Delete whole workout</button>`) + `</div></section>`;
    });
    s += `<div style="margin-top:16px"><button class="btn ink wide" data-act="close">Done</button></div></div></div>`;
    return s;
  }

  function summaryHTML() {
    const m = ui.summary, d = DAY[m.day];
    let s = `<div class="overlay" data-act="close-bg"><div class="sheet d-${d.color}" role="dialog" aria-modal="true" aria-label="Workout saved"><div class="grab"></div>
      <div class="hd"><div class="grow"><div class="lbl">Workout saved</div><h2>${esc(d.name)}</h2></div><button class="iconbtn" data-act="close" aria-label="Close">${ICON.close}</button></div>
      <div class="stats" style="margin-top:12px"><div><b class="num">${m.mins}</b><span>minutes</span></div><div><b class="num">${m.count}</b><span>exercises</span></div><div><b class="num">${m.sets}</b><span>sets</span></div></div>`;
    if (m.vol) s += `<p class="muted" style="margin:0">Total lifted: <b class="num" style="color:var(--ink)">${m.vol.toLocaleString('en-US')} kg</b></p>`;
    if (m.prs && m.prs.length) {
      s += `<div class="prbox"><div class="trophy" aria-hidden="true">★</div><div><b>New personal record${m.prs.length > 1 ? 's' : ''}!</b>${m.prs.map(p => `<div>${esc(cfg(p.id).name)}: <b class="num">${fmtW(p.top)} ${shortU(p.k)}</b> <span class="muted">(was ${fmtW(p.prev)})</span></div>`).join('')}</div></div>`;
    }
    if (m.ups.length) {
      s += `<div class="sec"><h3>Ready to go up</h3><span class="lbl">All sets done</span></div><ul class="histlist">`;
      m.ups.forEach(id => {
        const c = cfg(id);
        const u = shortU(c.kind);
        s += `<li style="align-items:center;gap:10px"><span>${esc(c.name)}<br><small class="muted">${fmtW(valOf(c))} ${u} now</small></span>${r1(valOf(c)) === r1(m.at[id]) ? `<button class="upbtn" data-act="up" data-id="${id}">${c.assist ? 'Less help' : 'Set'} ${fmtW(nextVal(c))} ${u}</button>` : `<span class="num" style="color:var(--good);font-weight:700">${fmtW(valOf(c))} ${u} ✓</span>`}</li>`;
      });
      s += '</ul>';
    } else s += `<p class="muted">Finish all sets of an exercise to unlock a step up next time.</p>`;
    s += `<div style="margin-top:16px"><button class="btn ink wide" data-act="close">Close</button></div></div></div>`;
    return s;
  }

  // ---------- warm-up player ----------
  let player = null;
  function openWarmup() {
    const d = DAY[ui.day];
    if (!draft || draft.day !== d.id) newDraft(d.id);
    unlockAudio(); markStart();
    player = { list: WARMUPS[d.warm], i: 0, left: WARMUPS[d.warm][0].s, paused: false, color: d.color, finished: false, last: Date.now() };
    renderLayer();
  }
  function playerHTML() {
    const p = player, w = p.list[p.i];
    const total = p.list.reduce((a, x) => a + x.s, 0);
    const doneBefore = p.list.slice(0, p.i).reduce((a, x) => a + x.s, 0);
    const remaining = total - doneBefore - (w.s - p.left);
    return `<div class="player d-${p.color}" role="dialog" aria-modal="true" aria-label="Warm-up"><div class="in">
      <div style="display:flex;align-items:center;gap:10px"><div style="flex:1"><div class="lbl">Warm-up · ${fmtT(remaining)} left</div></div><button class="iconbtn" data-act="warm-close" aria-label="Close warm-up">${ICON.close}</button></div>
      <div class="segs">${p.list.map((x, i) => `<i><b style="width:${i < p.i ? 100 : i === p.i ? Math.round((1 - p.left / x.s) * 100) : 0}%"></b></i>`).join('')}</div>
      <div class="bigfig">${fig(p.finished ? 'jumpingJacks' : w.anim, { always: true })}</div>
      ${p.finished
        ? `<div class="now"><div class="grow"><h2>Warmed up</h2><p>Muscles are ready. Start with a light warm-up set on your first exercise.</p></div></div><button class="btn primary wide" data-act="warm-close">Start training</button>`
        : `<div class="now"><div class="grow"><div class="lbl">${p.i + 1} of ${p.list.length}${p.i < p.list.length - 1 ? ' · next: ' + esc(p.list[p.i + 1].name) : ''}</div><h2>${esc(w.name)}</h2><p>${esc(w.tip)}</p></div><div class="cnt num" data-pcount>${fmtT(p.left)}</div></div>
      <div class="ctl"><button class="btn" data-act="warm-prev" ${p.i === 0 ? 'disabled' : ''}>Back</button><button class="btn primary" data-act="warm-pause">${p.paused ? 'Resume' : 'Pause'}</button><button class="btn" data-act="warm-next">Skip</button></div>`}
    </div></div>`;
  }
  function playerTick() {
    if (!player || player.paused || player.finished) return;
    const now = Date.now(), dt = (now - player.last) / 1000; player.last = now;
    player.left -= dt;
    if (player.left <= 0) { advance(1); return; }
    const el = $('[data-pcount]'); if (el) el.textContent = fmtT(player.left);
    const seg = document.querySelectorAll('.segs i b')[player.i]; if (seg) seg.style.width = Math.round((1 - player.left / player.list[player.i].s) * 100) + '%';
  }
  function advance(dir) {
    const p = player; p.i += dir;
    if (p.i < 0) p.i = 0;
    if (p.i >= p.list.length) { p.finished = true; p.i = p.list.length - 1; p.left = 0; beep(3); if (draft) { draft.warm = 1; saveDraft(); } }
    else { p.left = p.list[p.i].s; beep(dir > 0 ? 2 : 1, 660); }
    p.last = Date.now();
    renderLayer();
  }

  // ---------- timer (rest, hold, cardio) — saved with the workout so it survives closing the app ----------
  let timer = null;
  function setTimer(t) { timer = t; if (draft) { draft.timer = t ? Object.assign({}, t) : null; saveDraft(); } renderBar(); }
  function restoreTimer() {
    timer = draft && draft.timer ? Object.assign({}, draft.timer) : null;
    if (timer && timer.kind === 'rest' && Date.now() - timer.end > 30 * 60000) timer = null;
  }
  function startRest(id) {
    const c = cfg(id); const next = ((draft && draft.sets[id]) || []).filter(Boolean).length + 1;
    setTimer({ kind: 'rest', id, next, label: 'Rest · ' + c.name, total: c.rest, end: Date.now() + c.rest * 1000, go: false });
  }
  function startHold(id, i) { const c = cfg(id); setTimer({ kind: 'hold', id, i, label: 'Hold · ' + c.name + ' · set ' + (i + 1), total: c.hold, end: Date.now() + c.hold * 1000, go: false }); }
  function startCardio(id) { const c = cfg(id); setTimer({ kind: 'cardio', id, label: c.name, total: c.mins * 60, end: Date.now() + c.mins * 60000, paused: null, go: false }); }
  function timerLeft() { if (!timer) return 0; return timer.paused != null ? timer.paused : (timer.end - Date.now()) / 1000; }
  function renderBar() {
    let bar = $('#restbar');
    if (!timer) { if (bar) bar.remove(); document.body.style.paddingBottom = ''; return; }
    if (!bar) { bar = document.createElement('div'); bar.id = 'restbar'; document.body.appendChild(bar); }
    const d = DAY[ui.day || (draft && draft.day) || 'chest'];
    bar.className = 'restbar d-' + d.color + (timer.go ? ' go' : '');
    const btns = timer.go
      ? (timer.kind === 'rest' ? `<button class="rb" data-act="timer-close">Hide</button>` : `<button class="rb" data-act="timer-close">OK</button>`)
      : timer.kind === 'rest'
        ? `<button class="rb" data-act="t-15" aria-label="15 seconds less">−15</button><button class="rb" data-act="t+15" aria-label="15 seconds more">+15</button><button class="rb" data-act="timer-close">Skip</button>`
        : timer.kind === 'hold'
          ? `<button class="rb" data-act="hold-done">Done</button><button class="rb" data-act="timer-close">Cancel</button>`
          : `<button class="rb" data-act="t-pause">${timer.paused != null ? 'Resume' : 'Pause'}</button><button class="rb" data-act="stop-cardio">Stop</button>`;
    const goText = timer.kind === 'rest' ? `Rest over · go for set ${timer.next || ''} · ${cfg(timer.id).name}` : timer.kind === 'hold' ? 'Hold done · ' + timer.label.replace('Hold · ', '') : 'Time is up · ' + timer.label;
    bar.innerHTML = `<div class="in"><svg class="ring" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="20" style="stroke:currentColor;opacity:.2"/><circle data-ring cx="24" cy="24" r="20" style="stroke:var(--day)" stroke-dasharray="125.7" transform="rotate(-90 24 24)" stroke-linecap="round"/></svg>
      <div class="t"><small>${esc(timer.go ? goText : timer.label)}</small><b class="num" data-tleft>${timer.go ? (timer.kind === 'rest' ? 'Go +' + fmtT(-timerLeft()) : 'Go') : fmtT(timerLeft())}</b></div>${btns}</div>`;
    document.body.style.paddingBottom = 'calc(170px + env(safe-area-inset-bottom,0px))';
    tickBar();
  }
  function completeHold(t) {
    if (!draft) return;
    const c = cfg(t.id);
    const arr = draft.sets[t.id] || (draft.sets[t.id] = []); arr[t.i] = { s: c.hold }; saveDraft();
    if (arr.filter(Boolean).length < c.sets) startRest(t.id); else { setTimer(null); toast(c.name + ' done'); }
    render();
  }
  function tickBar() {
    if (!timer) return;
    const left = timerLeft();
    if (!timer.go && left <= 0) {
      beep(3);
      const t = timer;
      if (t.kind === 'hold') { completeHold(t); return; }
      timer.go = true;
      if (t.kind === 'cardio' && draft) { draft.done[t.id] = 1; }
      if (draft) { draft.timer = Object.assign({}, timer); saveDraft(); }
      if (t.kind === 'cardio') render();
      if (t.kind === 'rest') render();
      renderBar(); return;
    }
    if (timer.go) { if (timer.kind === 'rest') { const el = $('[data-tleft]'); if (el) el.textContent = 'Go +' + fmtT(-left); } return; }
    if (left <= 3.2 && left > 0 && timer.lastBeep !== Math.ceil(left)) { timer.lastBeep = Math.ceil(left); beep(1, 600); }
    const el = $('[data-tleft]'); if (el) el.textContent = fmtT(left);
    const ring = $('[data-ring]'); if (ring) ring.setAttribute('stroke-dashoffset', (125.7 * (1 - Math.max(0, left) / timer.total)).toFixed(1));
  }

  // ---------- render ----------
  function render() {
    const app = $('#app');
    if (ui.view === 'day') { const d = DAY[ui.day]; app.className = 'wrap d-' + d.color; app.innerHTML = dayView(); }
    else if (ui.view === 'progress') { app.className = 'wrap'; app.innerHTML = progressView() + tabs(); }
    else if (ui.view === 'calendar') { app.className = 'wrap'; app.innerHTML = calendarView() + tabs(); }
    else { app.className = 'wrap'; app.innerHTML = homeView() + tabs(); }
    collectAnims();
  }
  function renderLayer() {
    const L = $('#layer');
    if (player) L.innerHTML = playerHTML();
    else if (ui.sheet || ui.summary || ui.dayLog != null || ui.addTo || ui.setEdit) L.innerHTML = sheetHTML();
    else L.innerHTML = '';
    document.documentElement.style.overflow = L.innerHTML ? 'hidden' : '';
    collectAnims();
  }
  let toastT = null;
  function toast(msg) {
    let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
    t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600);
  }

  // ---------- animation loop ----------
  const reduce = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  let anims = [];
  const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => { e.target._vis = e.isIntersecting; }), { rootMargin: '80px' }) : null;
  const CAPS = ['', 'Squeeze', '', 'Reset', 'Hold · straight line'];
  function collectAnims() {
    anims = [...document.querySelectorAll('svg[data-anim]')];
    anims.forEach(el => {
      if (el.dataset.ph != null) { if (!el.firstChild) el.innerHTML = GymAnim.draw(el.dataset.anim, +el.dataset.ph); return; }
      if (io) io.observe(el);
      el._cap = el.parentElement && el.parentElement.querySelector('.cap');
      if (!el.firstChild) el.innerHTML = GymAnim.draw(el.dataset.anim, 0.4);
    });
  }
  let lastFrame = 0;
  function loop(ts) {
    if (ts - lastFrame > 32) {
      lastFrame = ts;
      for (const el of anims) {
        if (el.dataset.ph != null || el._vis === false || !el.isConnected) continue;
        if (reduce.matches && !el.hasAttribute('data-always')) continue;
        const k = el.dataset.anim, sp = +(el.dataset.speed || 1);
        const ph = ((ts / 1000) * sp / GymAnim.dur(k)) % 1;
        el.innerHTML = GymAnim.draw(k, ph);
        if (el._cap) {
          const i = GymAnim.phase(k, ph);
          if (i >= 0) {
            const v = GymAnim.info(k).verbs;
            const txt = i === 0 ? v[0] : i === 2 ? v[1] : CAPS[i];
            if (el._cap.textContent !== txt) { el._cap.textContent = txt; el._cap.dataset.p = i; }
          }
        }
      }
    }
    requestAnimationFrame(loop);
  }

  // ---------- actions ----------
  function openDay(id) {
    ui.view = 'day'; ui.day = id; ui.confirmDiscard = false; ui.confirmFinish = false; ui.navigated = true;
    if (!hasProgress() && (!draft || draft.day !== id)) newDraft(id);
    render(); renderBar(); window.scrollTo(0, 0);
  }
  function finishWorkout() {
    const d = DAY[draft.day], now = Date.now();
    let count = 0, sets = 0, vol = 0; const ups = [], at = {}, prs = [];
    dayIds(d).forEach(id => {
      const c = cfg(id);
      if (c.kind === 'time') {
        if (draft.done[id]) { (hist.log[id] = hist.log[id] || []).push({ t: now, k: 'time', m: c.mins, v: c.v, d: 1, n: 1 }); count++; sets++; }
        return;
      }
      const done = (draft.sets[id] || []).map(x => (x ? setVal(c, x) : null)).filter(Boolean);
      const n = done.length;
      if (!n) return;
      const entry = { t: now, k: c.kind, v: c.v, d: n, n: c.sets, sets: done };
      if (c.assist) entry.a = 1;
      const top = topOf(entry);
      if (c.kind === 'kg') {
        entry.w = top;
        entry.vol = Math.round(done.reduce((a, x) => a + (x.w || 0) * (x.r || 0) * (c.each ? 2 : 1), 0));
        entry.hit = done.every(x => (c.assist ? x.w <= c.w : x.w >= c.w) && x.r >= c.reps);
        vol += entry.vol;
      } else if (c.kind === 'reps') { entry.r = top; entry.hit = done.every(x => x.r >= c.reps); }
      else { entry.s = top; entry.hit = done.every(x => x.s >= c.hold); }
      const prev = bestBefore(id, c.v, c.kind, now, c.assist);
      if (prev != null && top != null && better(c.assist, top, prev) && !(c.kind === 'kg' && c.bw && !top)) prs.push({ id, top, prev, k: c.kind });
      (hist.log[id] = hist.log[id] || []).push(entry);
      hist.log[id] = hist.log[id].slice(-160);
      count++; sets += n;
      if (n >= c.sets && entry.hit && !(c.kind === 'kg' && (c.w == null || (c.bw && !c.w)))) { ups.push(id); at[id] = valOf(c); }
    });
    if (!count) { ui.confirmFinish = false; render(); toast('Tick at least one set first.'); return; }
    const mins = Math.max(1, Math.round((now - (draft.start || now)) / 60000));
    hist.sessions.push({ t: now, day: d.id, min: mins, n: count, vol });
    hist.sessions = hist.sessions.slice(-600);
    saveHist();
    timer = null; renderBar();
    ui.summary = { day: d.id, mins, count, sets, ups, at, prs, vol };
    draft = null; saveDraft();
    ui.view = 'home'; ui.confirmFinish = false; render(); renderLayer(); window.scrollTo(0, 0);
  }

  document.addEventListener('click', ev => {
    const b = ev.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act, id = b.dataset.id;
    if (act === 'close-bg') { if (ev.target !== b) return; ui.setEdit = null; ui.sheet = null; ui.summary = null; ui.dayLog = null; ui.addTo = null; ui.confirmRm = null; renderLayer(); render(); return; }
    switch (act) {
      case 'home': ui.view = 'home'; ui.navigated = true; render(); window.scrollTo(0, 0); break;
      case 'calendar': ui.view = 'calendar'; ui.navigated = true; ui.calMonth = null; ui.sheet = null; ui.dayLog = null; renderLayer(); render(); window.scrollTo(0, 0); break;
      case 'cal-prev': case 'cal-next': { const b0 = ui.calMonth != null ? new Date(ui.calMonth) : new Date(); ui.calMonth = new Date(b0.getFullYear(), b0.getMonth() + (act === 'cal-next' ? 1 : -1), 1).getTime(); render(); break; }
      case 'cal-today': ui.calMonth = null; render(); break;
      case 'plan-day': {
        const i = +b.dataset.dow; let d = planDays().slice();
        d = d.includes(i) ? d.filter(x => x !== i) : [...d, i].sort((a, x) => a - x);
        if (!d.length) { toast('Keep at least one gym day.'); break; }
        prefs.plan = { days: d, fixed: planFixed() }; savePrefs(); render(); toast('Gym days saved'); break;
      }
      case 'edit-toggle': ui.edit = ui.edit === b.dataset.key ? null : b.dataset.key; ui.confirmRm = null; render(); break;
      case 'ex-up': case 'ex-down': {
        const k = b.dataset.key, l = listFor(k), i = l.indexOf(id), j = i + (act === 'ex-up' ? -1 : 1);
        if (i < 0 || j < 0 || j >= l.length) break; [l[i], l[j]] = [l[j], l[i]]; setList(k, l); render(); break;
      }
      case 'ex-remove': ui.confirmRm = id; if (ui.sheet) renderLayer(); render(); break;
      case 'ex-remove-no': ui.confirmRm = null; renderLayer(); break;
      case 'ex-remove-yes': {
        const k = b.dataset.key; setList(k, listFor(k).filter(x => x !== id)); ui.confirmRm = null;
        if (timer && timer.id === id) setTimer(null);
        if (ui.sheet === id) { ui.sheet = null; renderLayer(); }
        render(); toast('Removed'); break;
      }
      case 'ex-restore': { const k = b.dataset.key; setList(k, [...listFor(k), id]); render(); toast('Added back'); break; }
      case 'ex-reset': { const k = b.dataset.key; const lay = Object.assign({}, prefs.layout || {}); delete lay[k]; prefs.layout = lay; savePrefs(); render(); toast('Original list restored'); break; }
      case 'ex-add': ui.addTo = b.dataset.key; renderLayer(); setTimeout(() => { const n = $('#a-name'); if (n) n.focus(); }, 50); break;
      case 'progress': ui.view = 'progress'; ui.navigated = true; render(); window.scrollTo(0, 0); break;
      case 'open-day': ui.dayLog = null; ui.sheet = null; ui.edit = null; renderLayer(); openDay(b.dataset.day); break;
      case 'discard': ui.confirmDiscard = true; render(); break;
      case 'discard-no': ui.confirmDiscard = false; render(); break;
      case 'discard-yes': timer = null; draft = null; saveDraft(); renderBar(); openDay(ui.day); toast('Discarded.'); break;
      case 'finish': ui.confirmFinish = true; render(); break;
      case 'finish-no': ui.confirmFinish = false; render(); break;
      case 'finish-yes': finishWorkout(); break;
      case 'variant': {
        const alt = b.dataset.v === 'a'; const cur = cfg(id).alt;
        if (alt !== cur) {
          setPref(id, { alt });
          if (draft && draft.sets[id]) { delete draft.sets[id]; saveDraft(); }
          if (timer && timer.id === id) setTimer(null);
        }
        render(); if (ui.sheet) renderLayer(); break;
      }
      case 'v+': case 'v-': {
        const c = cfg(id); const dir = act === 'v+' ? 1 : -1;
        let v;
        if (c.kind === 'kg') v = c.w == null ? (c.e.w ?? 0) : r1(Math.max(0, c.w + dir * c.step));
        else if (c.kind === 'time') v = Math.max(1, Math.min(120, (c.mins || 10) + dir));
        else if (c.kind === 'hold') v = Math.max(5, Math.min(600, (c.hold || 30) + dir * 5));
        else v = Math.max(1, Math.min(100, (c.reps || 10) + dir));
        setPref(id, { [keyOf(c)]: v }); render(); break;
      }
      case 'up': {
        const c = cfg(id); const v = nextVal(c);
        setPref(id, { [keyOf(c)]: v }); toast(`${c.name}: ${fmtW(v)} ${shortU(c.kind)}`); render(); if (ui.summary) renderLayer(); break;
      }
      case 'set': {
        unlockAudio(); markStart();
        const c = cfg(id), i = +b.dataset.i;
        const arr = draft.sets[id] || (draft.sets[id] = []);
        if (arr[i]) { ui.setEdit = { id, i }; renderLayer(); break; }
        if (c.kind === 'hold') {
          if (timer && timer.kind === 'hold' && timer.id === id && timer.i === i) completeHold(timer);
          else startHold(id, i);
          render(); break;
        }
        arr[i] = setRec(c); saveDraft();
        if (arr.filter(Boolean).length >= c.sets) { setTimer(null); toast(c.name + ' done'); } else startRest(id);
        render(); break;
      }
      case 'se-w+': case 'se-w-': case 'se-r+': case 'se-r-': case 'se-s+': case 'se-s-': {
        const { id: sid, i } = ui.setEdit; const c = cfg(sid); const arr = draft.sets[sid];
        const x = Object.assign({}, setVal(c, arr[i])); const dir = act.endsWith('+') ? 1 : -1;
        if (act.startsWith('se-w')) x.w = r1(Math.max(0, (x.w || 0) + dir * c.step));
        else if (act.startsWith('se-r')) x.r = Math.max(0, (x.r || 0) + dir);
        else x.s = Math.max(0, (x.s || 0) + dir * 5);
        arr[i] = x; saveDraft(); renderLayer(); render(); break;
      }
      case 'se-undo': { const { id: sid, i } = ui.setEdit; draft.sets[sid][i] = null; saveDraft(); ui.setEdit = null; if (timer && timer.kind === 'rest' && timer.id === sid) setTimer(null); renderLayer(); render(); break; }
      case 'bw-del': { const t = +b.dataset.t; hist.body = (hist.body || []).filter(x => x.t !== t); delMark().b.push(t); saveHist(); render(); toast('Deleted'); break; }
      case 'hold-done': if (timer && timer.kind === 'hold') completeHold(timer); break;
      case 'wu': unlockAudio(); markStart(); draft.wu[id] = draft.wu[id] ? 0 : 1; saveDraft(); render(); break;
      case 'cardio': unlockAudio(); markStart(); startCardio(id); render(); break;
      case 'stop-cardio': setTimer(null); render(); break;
      case 'cardio-done': markStart(); draft.done[id] = draft.done[id] ? 0 : 1; saveDraft(); render(); break;
      case 't+15': if (timer) { timer.end += 15000; timer.total += 15; setTimer(timer); } break;
      case 't-15': if (timer) { timer.end -= 15000; setTimer(timer); } break;
      case 't-pause': if (timer) { if (timer.paused != null) { timer.end = Date.now() + timer.paused * 1000; timer.paused = null; } else timer.paused = timerLeft(); setTimer(timer); } break;
      case 'timer-close': setTimer(null); render(); break;
      case 'sheet': ui.sheet = id; renderLayer(); break;
      case 'backup': doBackup(); break;
      case 'slow': ui.slow = !ui.slow; renderLayer(); break;
      case 'close': ui.setEdit = null; ui.sheet = null; ui.summary = null; ui.dayLog = null; ui.confirmDel = null; ui.addTo = null; ui.confirmRm = null; renderLayer(); render(); break;
      case 'daylog': ui.dayLog = +b.dataset.date; ui.confirmDel = null; renderLayer(); break;
      case 'del-entry': deleteEntry(id, +b.dataset.t, b.dataset.v); toast('Removed'); renderLayer(); render(); break;
      case 'del-session': ui.confirmDel = +b.dataset.t; renderLayer(); break;
      case 'del-session-no': ui.confirmDel = null; renderLayer(); break;
      case 'del-session-yes': deleteSession(+b.dataset.t); ui.confirmDel = null; toast('Workout deleted'); renderLayer(); render(); break;
      case 'warmup': openWarmup(); break;
      case 'warm-close': player = null; renderLayer(); render(); break;
      case 'warm-pause': player.paused = !player.paused; player.last = Date.now(); renderLayer(); break;
      case 'warm-next': advance(1); break;
      case 'warm-prev': advance(-1); break;
    }
  });
  document.addEventListener('submit', ev => {
    if (ev.target.id === 'addform') { ev.preventDefault(); addExercise(ev.target); }
    if (ev.target.id === 'htform') {
      ev.preventDefault(); const v = parseInt(ev.target.elements.cm.value, 10);
      if (isNaN(v) || v < 120 || v > 230) { toast('Enter your height in cm, like 190'); return; }
      prefs.height = v; savePrefs(); render(); toast('Height saved'); return;
    }
    if (ev.target.id === 'bwform') {
      ev.preventDefault();
      const v = parseFloat(ev.target.elements.kg.value);
      if (isNaN(v) || v < 20 || v > 400) { toast('Enter your weight in kg, like 82.5'); return; }
      const today = dayStart(Date.now());
      hist.body = (hist.body || []).filter(x => dayStart(x.t) !== today);
      hist.body.push({ t: Date.now(), kg: r1(v) }); saveHist(); render(); toast('Weight logged');
    }
  });
  document.addEventListener('change', ev => {
    if (ev.target.dataset && ev.target.dataset.planDow != null) {
      const fx = Object.assign({}, planFixed()); const v = ev.target.value; const i = ev.target.dataset.planDow;
      if (v) fx[i] = v; else delete fx[i];
      prefs.plan = { days: planDays(), fixed: fx }; savePrefs(); render(); toast('Plan saved'); return;
    }
    if (ev.target.id === 'restore-file') {
      const f = ev.target.files && ev.target.files[0]; if (!f) return;
      const r = new FileReader(); r.onload = () => restoreFrom(String(r.result)); r.onerror = () => toast('Could not read that file.'); r.readAsText(f);
      ev.target.value = ''; return;
    }
    const el = ev.target.closest('[data-field]'); if (!el) return;
    const id = el.dataset.id, f = el.dataset.field, c = cfg(id);
    if (f === 'name') { const v = el.value.trim(); setPref(id, c.alt ? { aname: v || undefined } : { name: v || undefined }); }
    else if (f === 'step') setPref(id, c.alt ? { astep: +el.value } : { step: +el.value });
    else if (f === 'memo') { const v = el.value.trim(); setPref(id, { memo: v || undefined }); render(); toast('Note saved'); return; }
    else if (f === 'anim') { setPref(id, c.alt ? { aanim: el.value } : { anim: el.value }); renderLayer(); }
    else if (f === 'reps') setPref(id, c.alt ? { areps: +el.value } : { reps: +el.value });
    else setPref(id, { [f]: +el.value });
    render(); toast('Saved');
  });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && (ui.sheet || ui.summary || ui.dayLog != null || ui.addTo || ui.setEdit)) { ui.setEdit = null; ui.sheet = null; ui.summary = null; ui.dayLog = null; ui.addTo = null; renderLayer(); render(); } });

  setInterval(() => {
    tickBar(); playerTick();
    if (draft && draft.start) document.querySelectorAll('[data-clock]').forEach(el => { el.textContent = fmtT((Date.now() - draft.start) / 1000); });
  }, 250);

  // open straight into a workout that is still in progress
  restoreTimer();
  if (hasProgress()) { ui.view = 'day'; ui.day = draft.day; }
  render(); renderBar();
  requestAnimationFrame(loop);
  initCloud();
})();

</script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
</script>
