<!doctype html>
<html lang="en">
<head>
<title>Iron Week</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Iron Week">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E8ECEF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1013" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800&display=swap">
<style>
/* Layout: one phone-width column. Each training day wears its bumper-plate color (25 red, 20 blue, 15 yellow, 10 green, 5 white) on a knurled band. */
:root{
  --bg:#E8ECEF; --surface:#FFFFFF; --surface2:#F2F4F6; --ink:#12161B; --ink2:#59636D; --line:#D2D8DD;
  --fig:#161B21; --eq:#8D96A0; --pad:#55606B; --padf:#D5DBE0; --gnd:#C4CBD1; --wall:#DCE1E5;
  --red:#C42238; --blue:#1D56B3; --yellow:#E2AC05; --green:#22844A; --steel:#66727E;
  --on-red:#fff; --on-blue:#fff; --on-yellow:#14181D; --on-green:#fff; --on-steel:#fff;
  --good:#1F7F45; --good-bg:#DDF1E4;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --day:var(--ink); --on:#fff;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1013; --surface:#171B20; --surface2:#1F242A; --ink:#E9EDF0; --ink2:#99A3AD; --line:#2B3239;
  --fig:#E4E9ED; --eq:#68727C; --pad:#86919B; --padf:#2A3138; --gnd:#323A42; --wall:#262C33;
  --red:#F04A5E; --blue:#5E92EE; --yellow:#F3C232; --green:#3DBE70; --steel:#C3CCD5;
  --on-red:#14181D; --on-blue:#0D1013; --on-yellow:#14181D; --on-green:#0D1013; --on-steel:#0D1013;
  --good:#4FD188; --good-bg:#16301F;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1013; --surface:#171B20; --surface2:#1F242A; --ink:#E9EDF0; --ink2:#99A3AD; --line:#2B3239;
  --fig:#E4E9ED; --eq:#68727C; --pad:#86919B; --padf:#2A3138; --gnd:#323A42; --wall:#262C33;
  --red:#F04A5E; --blue:#5E92EE; --yellow:#F3C232; --green:#3DBE70; --steel:#C3CCD5;
  --on-red:#14181D; --on-blue:#0D1013; --on-yellow:#14181D; --on-green:#0D1013; --on-steel:#0D1013;
  --good:#4FD188; --good-bg:#16301F;
  color-scheme:dark;
}
.d-red{--day:var(--red);--on:var(--on-red)} .d-blue{--day:var(--blue);--on:var(--on-blue)}
.d-yellow{--day:var(--yellow);--on:var(--on-yellow)} .d-green{--day:var(--green);--on:var(--on-green)}
.d-steel{--day:var(--steel);--on:var(--on-steel)}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2.5px solid var(--day);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}
h1,h2,h3{margin:0;text-wrap:balance}
.disp{font-family:var(--display);font-weight:800;letter-spacing:.01em;line-height:.95;text-transform:uppercase}
.lbl{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding:12px 0 10px;min-height:56px}
.top .grow{flex:1;min-width:0}
.brand{font-size:30px}
.sync{font-size:12px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--eq);display:inline-block}
.sync.cloud i{background:var(--good)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* home */
.intro{padding:4px 0 18px}
.intro p{margin:6px 0 0;color:var(--ink2)}
.week button{font:inherit;color:inherit;cursor:pointer}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0 22px}
.week button{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 0 8px;text-align:center;min-width:0}
.week b{display:block;font-size:11px;letter-spacing:.06em;color:var(--ink2);font-weight:600}
.week span{display:block;font-weight:700;font-size:15px}
.week .dots{display:flex;justify-content:center;gap:3px;height:8px;margin-top:4px}
.week .dots i{width:8px;height:8px;border-radius:50%;background:var(--day)}
.week .today{border-color:var(--ink);}
.rmbtn{flex:none;min-height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--red);background:var(--surface)}
.logday{margin-top:16px}
.logday h3{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--day);margin-right:6px;vertical-align:1px}
.daylist{display:grid;gap:10px}
.daycard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.plate{width:58px;height:58px;border-radius:50%;flex:none;background:var(--day);position:relative;display:grid;place-items:center;color:var(--on);font-family:var(--display);font-weight:800;font-size:19px;
  box-shadow:inset 0 0 0 5px color-mix(in srgb,var(--day) 70%,#000 30%)}
.plate::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--day) 60%,#000 40%);bottom:6px}
.plate span{transform:translateY(-6px)}
.daycard .t{flex:1;min-width:0}
.daycard h3{font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;line-height:1}
.daycard .s{font-size:14px;color:var(--ink2);margin-top:4px}
.daycard .chev{color:var(--ink2);flex:none}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);vertical-align:3px;margin-left:6px}
.note{margin:18px 0 0;background:var(--surface2);border-radius:var(--r);padding:12px 14px;font-size:14px;color:var(--ink2)}
.note b{color:var(--ink)}
.resume{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--day);color:var(--on);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.resume .t{flex:1}
.resume b{font-family:var(--display);font-size:22px;text-transform:uppercase;display:block;line-height:1}

/* day */
.band{position:relative;border-radius:var(--r);background:var(--day);color:var(--on);padding:16px 16px 14px;overflow:hidden;margin-bottom:14px}
.band::before{content:"";position:absolute;inset:0;opacity:.16;pointer-events:none;
  background:repeating-linear-gradient(45deg,currentColor 0 1px,transparent 1px 6px),repeating-linear-gradient(-45deg,currentColor 0 1px,transparent 1px 6px)}
.band > *{position:relative}
.band h2{font-size:40px}
.band .meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-weight:600;font-size:14px}
.band .clock{font-family:var(--display);font-size:22px;font-weight:800}
.blocker{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.blocker p{margin:0 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;font-weight:700;background:var(--surface2);border:1px solid var(--line)}
.btn.primary{background:var(--day);color:var(--on);border-color:transparent}
.btn.ink{background:var(--ink);color:var(--bg);border-color:transparent}
.btn.wide{width:100%}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px}
.sec h3{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase}

.warm{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.warm .t{flex:1;min-width:0}
.warm h4{margin:0;font-size:17px}
.warm p{margin:2px 0 0;font-size:13px;color:var(--ink2)}
.warm.done{border-color:var(--good)}

.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:12px}
.ex + .ex{margin-top:10px}
.ex.complete{border-color:color-mix(in srgb,var(--good) 60%,var(--line))}
.ex-top{display:flex;gap:12px;align-items:flex-start}
.animbox{width:96px;height:82px;flex:none;border-radius:10px;background:var(--surface2);display:block;position:relative;overflow:hidden}
.animbox svg{width:100%;height:100%;display:block}
.animbox .how{position:absolute;right:4px;bottom:4px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--surface);border-radius:6px;padding:1px 5px;color:var(--ink2)}
.ex-head{flex:1;min-width:0}
.ex-name{font-weight:700;font-size:17px;line-height:1.2;text-align:left;display:block}
.ex-meta{font-size:13px;color:var(--ink2);margin-top:3px}
.seg{display:inline-flex;margin-top:8px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:2px;max-width:100%}
.seg button{min-height:32px;padding:0 10px;border-radius:8px;font-size:13px;font-weight:700;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--day);color:var(--on)}
.ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wt{display:flex;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.wt button{width:46px;height:46px;font-size:24px;font-weight:600;display:grid;place-items:center}
.wt button:active{background:var(--line)}
.wt .v{min-width:92px;text-align:center;padding:0 2px}
.wt .v b{font-family:var(--display);font-size:30px;font-weight:800;line-height:1}
.wt .v small{font-size:12px;font-weight:600;color:var(--ink2);margin-left:3px}
.hint{font-size:13px;color:var(--ink2);flex:1;min-width:120px}
.hint.up{color:var(--good);font-weight:600}
.upbtn{display:inline-block;margin-top:2px;background:var(--good-bg);color:var(--good);font-weight:700;font-size:13px;border-radius:8px;padding:4px 8px}
.sets{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.set{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);font-weight:700;font-size:16px;display:grid;place-items:center;background:var(--surface)}
.set.on{background:var(--day);border-color:var(--day);color:var(--on)}
.set.wu{width:auto;border-radius:23px;padding:0 12px;font-size:13px;border-style:dashed;color:var(--ink2)}
.set.wu.on{border-style:solid;color:var(--on)}
.sets .reps{font-size:13px;color:var(--ink2);margin-left:2px}
.cardiotimer{display:flex;gap:8px;flex-wrap:wrap}

/* rest bar */
.restbar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--ink);color:var(--bg)}
.restbar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.restbar .ring{width:48px;height:48px;flex:none}
.restbar .ring circle{fill:none;stroke-width:5}
.restbar .t{flex:1;min-width:0}
.restbar small{display:block;font-size:12px;font-weight:600;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.restbar b{font-family:var(--display);font-size:36px;font-weight:800;line-height:1}
.restbar .rb{min-width:44px;height:40px;border-radius:10px;background:color-mix(in srgb,var(--bg) 14%,transparent);font-weight:700;font-size:14px;padding:0 8px}
.restbar.go{background:var(--day);color:var(--on)}

/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tabs button{height:48px;border-radius:12px;font-weight:700;font-size:15px;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:8px}
.tabs button[aria-current="page"]{background:var(--surface2);color:var(--ink)}
.tabs svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* overlay sheets */
.overlay{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);overflow:auto;border-radius:20px 20px 0 0;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overscroll-behavior:contain}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet .hd{display:flex;align-items:flex-start;gap:10px}
.sheet .hd .grow{flex:1;min-width:0}
.sheet h2{font-family:var(--display);font-weight:800;font-size:30px;text-transform:uppercase;line-height:1}
.bigfig{background:var(--surface2);border-radius:var(--r);margin:12px 0;aspect-ratio:200/170;max-width:100%;max-height:44vh;width:100%}
.bigfig svg{width:100%;height:100%;display:block}
.cues{margin:0;padding:0;list-style:none;display:grid;gap:8px;counter-reset:c}
.cues li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.cues li::before{counter-increment:c;content:counter(c);flex:none;width:24px;height:24px;border-radius:50%;background:var(--day);color:var(--on);font-weight:700;font-size:13px;display:grid;place-items:center}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:6px}
.fields label{display:grid;gap:4px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);min-width:0}
.fields input,.fields select{font:inherit;font-size:17px;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:10px;height:44px;padding:0 10px;width:100%;min-width:0;text-transform:none;letter-spacing:0}
.fields .full{grid-column:1/-1}
.spark{width:100%;height:64px;display:block}
.spark .ln{fill:none;stroke:var(--day);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.spark .ar{fill:var(--day);opacity:.12}
.spark .dot{fill:var(--day)}
.spark .grid{stroke:var(--line);stroke-width:1}
.spark text{fill:var(--ink2);font-size:10px;font-family:var(--body)}
.histlist{margin:8px 0 0;padding:0;list-style:none;font-size:14px}
.histlist li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}

/* warm-up player */
.player{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.player .in{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
.player .bigfig{flex:1;min-height:0;max-height:none;margin:0;aspect-ratio:auto}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.segs i b{position:absolute;inset:0 auto 0 0;background:var(--day)}
.player .now{display:flex;align-items:flex-end;gap:12px}
.player .now .grow{flex:1;min-width:0}
.player .now h2{font-family:var(--display);font-size:38px;font-weight:800;text-transform:uppercase;line-height:1}
.player .now p{margin:4px 0 0;color:var(--ink2)}
.player .cnt{font-family:var(--display);font-size:64px;font-weight:800;line-height:.9}
.player .ctl{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px}

/* progress */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:6px 0 8px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stats b{font-family:var(--display);font-size:32px;font-weight:800;display:block;line-height:1}
.stats span{font-size:12px;color:var(--ink2);font-weight:600}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 92px auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.prow .n{font-weight:600;font-size:15px;min-width:0}
.prow .n small{display:block;font-weight:500;color:var(--ink2);font-size:12px}
.prow .w{text-align:right;font-weight:700;white-space:nowrap}
.prow .w small{display:block;font-size:12px;font-weight:600}
.prow .w .g{color:var(--good)}
.prow svg{width:92px;height:30px}
.pgroup{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 14px;margin-bottom:12px}
.pgroup h3{font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;display:flex;align-items:center;gap:8px;padding:10px 0 4px}
.pgroup h3 i{width:12px;height:12px;border-radius:50%;background:var(--day)}
.pgroup .prow:last-child{border-bottom:0}
.empty{color:var(--ink2);font-size:14px;padding:6px 0 10px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}

/* exercise figure */
.fig .bd{fill:var(--fig);stroke:var(--surface2);stroke-width:2.2;paint-order:stroke;stroke-linejoin:round}
.fig .tor{stroke:var(--fig);stroke-width:4}
.fig .far{opacity:.38}.fig .far2{opacity:.45}
.fig .ms{fill:var(--day)}
.fig .msc{fill:var(--day);opacity:.9}
.fig .arw{fill:none;stroke:var(--day);stroke-width:2.2;stroke-dasharray:4 4;opacity:.75;stroke-linecap:round}
.fig .arwh{fill:var(--day)}
.fig .eq{stroke:var(--eq);stroke-width:4;stroke-linecap:round;fill:none}
.fig .eqf{fill:var(--eq)}
.fig .eqo{fill:none;stroke:var(--eq);stroke-width:2.5}
.fig .frame{fill:none;stroke:var(--eq);stroke-width:2}
.fig .pad{stroke:var(--pad);stroke-width:8;stroke-linecap:round}
.fig .padf{fill:var(--padf)}
.fig .padc{fill:var(--pad)}
.fig .mv,.fig .mvbar{stroke:var(--day);stroke-width:4.5;stroke-linecap:round}
.fig .mvf,.fig .plate{fill:var(--day)}
.fig .cb{stroke:var(--ink2);stroke-width:1.4}
.fig .guide{stroke:var(--eq);stroke-width:2;opacity:.6}
.fig .gnd{stroke:var(--gnd);stroke-width:2}
.fig .belt{stroke:var(--pad);stroke-width:6}

<body>


<div class="wrap" id="app"></div>
<div id="layer"></div>
<script>
/* Stick-figure exercise animator. Side view faces right. viewBox 0 0 200 170, ground y=158. */
(function (root) {
  const L = { T: 48, UA: 26, FA: 24, TH: 36, SN: 36, FT: 11, NK: 15, HR: 9 };
  const GY = 158;
  const R = Math.PI / 180;
  const dir = d => [Math.sin(d * R), Math.cos(d * R)];
  const add = (p, v, s = 1) => [p[0] + v[0] * s, p[1] + v[1] * s];
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = t => (t < 0 ? 0 : t > 1 ? 1 : t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
  const f = x => (Math.round(x * 10) / 10).toString();
  const norm = v => { const d = Math.hypot(v[0], v[1]) || 1; return [v[0] / d, v[1] / d]; };
  const sh = (hx, hy, t) => add([hx, hy], dir(t), L.T);

  function ik(r, t, l1, l2, b) {
    let dx = t[0] - r[0], dy = t[1] - r[1], d = Math.hypot(dx, dy) || 0.001;
    const mx = l1 + l2 - 0.3, mn = Math.abs(l1 - l2) + 0.5;
    if (d > mx) { dx *= mx / d; dy *= mx / d; d = mx; }
    if (d < mn) { dx *= mn / d; dy *= mn / d; d = mn; }
    const a = Math.atan2(dy, dx);
    const c = Math.max(-1, Math.min(1, (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d)));
    const o = a + b * Math.acos(c);
    return [[r[0] + Math.cos(o) * l1, r[1] + Math.sin(o) * l1], [r[0] + dx, r[1] + dy]];
  }

  function mix(a, b, t) {
    const o = {};
    for (const k in a) {
      const va = a[k], vb = b[k];
      if (vb === undefined) { o[k] = va; continue; }
      if (typeof va === 'number') o[k] = lerp(va, vb, t);
      else if (Array.isArray(va)) o[k] = va.map((x, i) => lerp(x, vb[i], t));
      else o[k] = va;
    }
    for (const k in b) if (!(k in o)) o[k] = b[k];
    return o;
  }

  function solveSide(p) {
    const H = [p.hx, p.hy];
    const S = add(H, dir(p.t), L.T);
    const head = add(S, dir(p.t + (p.hd || 0)), L.NK);
    let E, W, E2, W2, K, A, K2, A2;
    if (p.E && p.W) { E = p.E; W = p.W; }
    else if (p.hand) [E, W] = ik(S, p.hand, L.UA, L.FA, p.eb ?? 1);
    else { E = add(S, dir(p.ua ?? 0), L.UA); W = add(E, dir(p.fa ?? 0), L.FA); }
    if (p.E2 && p.W2) { E2 = p.E2; W2 = p.W2; }
    else if (p.hand2) [E2, W2] = ik(S, p.hand2, L.UA, L.FA, p.eb ?? 1);
    else if (p.ua2 != null) { E2 = add(S, dir(p.ua2), L.UA); W2 = add(E2, dir(p.fa2 ?? p.ua2), L.FA); }
    else { E2 = E; W2 = W; }
    if (p.foot) [K, A] = ik(H, p.foot, L.TH, L.SN, p.kb ?? -1);
    else { K = add(H, dir(p.th ?? 0), L.TH); A = add(K, dir(p.sn ?? 0), L.SN); }
    if (p.foot2) [K2, A2] = ik(H, p.foot2, L.TH, L.SN, p.kb2 ?? p.kb ?? -1);
    else if (p.th2 != null) { K2 = add(H, dir(p.th2), L.TH); A2 = add(K2, dir(p.sn2 ?? p.th2), L.SN); }
    else { K2 = K; A2 = A; }
    const Toe = add(A, dir(p.ft ?? 90), L.FT);
    const Toe2 = add(A2, dir(p.ft2 ?? p.ft ?? 90), L.FT);
    return { view: 'side', p, H, S, head, E, W, E2, W2, K, A, K2, A2, Toe, Toe2 };
  }

  function solveFront(p) {
    const H = [p.hx, p.hy];
    const C = add(H, dir(p.t ?? 180), L.T);
    const up = p.up || 0;
    const SR = [C[0] + 15, C[1] - up], SL = [C[0] - 15, C[1] - up];
    const head = [C[0], C[1] - L.NK - up * 0.15];
    const rel = (v, m) => [C[0] + v[0] * m, C[1] + v[1] - up];
    let E, W, E2, W2;
    if (p.ER && p.WR) {
      E = rel(p.ER, 1); W = rel(p.WR, 1);
      E2 = p.EL ? rel(p.EL, 1) : rel(p.ER, -1);
      W2 = p.WL ? rel(p.WL, 1) : rel(p.WR, -1);
    } else {
      const hr = rel(p.hand || [19, 48], 1), hl = p.handL ? rel(p.handL, 1) : rel(p.hand || [19, 48], -1);
      [E, W] = ik(SR, hr, L.UA, L.FA, 1);
      [E2, W2] = ik(SL, hl, L.UA, L.FA, -1);
    }
    const tl = p.tl ?? 1;
    const HR = [H[0] + 8, H[1]], HL = [H[0] - 8, H[1]];
    const th = p.th ?? 3, sn = p.sn ?? th, thL = p.thL ?? th, snL = p.snL ?? thL;
    const K = [HR[0] + Math.sin(th * R) * L.TH, HR[1] + Math.cos(th * R) * L.TH * tl];
    const A = add(K, dir(sn), L.SN);
    const K2 = [HL[0] - Math.sin(thL * R) * L.TH, HL[1] + Math.cos(thL * R) * L.TH * tl];
    const A2 = add(K2, [-Math.sin(snL * R), Math.cos(snL * R)], L.SN);
    return { view: 'front', p, H, C, S: SR, S2: SL, HR, HL, head, E, W, E2, W2, K, A, K2, A2, Toe: [A[0] + 6, A[1] + 1], Toe2: [A2[0] - 6, A2[1] + 1] };
  }

  const solve = p => (p.view === 'front' ? solveFront(p) : solveSide(p));
  const ln = (a, b, c) => `<line class="${c}" x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}"/>`;
  const circ = (c, r, cls) => `<circle class="${cls}" cx="${f(c[0])}" cy="${f(c[1])}" r="${r}"/>`;

  // tapered capsule between two points
  function cap(a, b, r1, r2) {
    const dx = b[0] - a[0], dy = b[1] - a[1], Ln = Math.hypot(dx, dy) || 0.01, ux = dx / Ln, uy = dy / Ln, nx = -uy, ny = ux;
    const p1 = [a[0] + nx * r1, a[1] + ny * r1], p2 = [b[0] + nx * r2, b[1] + ny * r2], p3 = [b[0] - nx * r2, b[1] - ny * r2], p4 = [a[0] - nx * r1, a[1] - ny * r1];
    return `M${f(p1[0])} ${f(p1[1])}L${f(p2[0])} ${f(p2[1])}A${r2} ${r2} 0 0 0 ${f(p3[0])} ${f(p3[1])}L${f(p4[0])} ${f(p4[1])}A${r1} ${r1} 0 0 0 ${f(p1[0])} ${f(p1[1])}Z`;
  }
  const pth = (d, cls) => `<path class="${cls}" d="${d}"/>`;
  const lp = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];
  // side 1 = counter-clockwise normal (front of a hanging arm / thigh), -1 = clockwise normal
  function band(a, b, s0, s1, side, r, off) {
    const u = norm([b[0] - a[0], b[1] - a[1]]); const n = [u[1] * side, -u[0] * side];
    return pth(cap(add(lp(a, b, s0), n, off), add(lp(a, b, s1), n, off), r, r), 'ms');
  }

  function muscleSide(J, mus) {
    if (!mus || !mus.length) return { torso: '', ua: '', th: '', sn: '', hip: '', sh: '' };
    const pr = J.p.prone ? -1 : 1;
    const has = m => mus.includes(m);
    // torso front = clockwise normal of hip->shoulder, i.e. side -1
    const F = -1 * pr, B = 1 * pr;
    let torso = '', ua = '', th = '', sn = '', hip = '', sh = '';
    if (has('chest')) torso += band(J.H, J.S, 0.55, 0.9, F, 4.6, 6.5);
    if (has('abs')) torso += band(J.H, J.S, 0.12, 0.5, F, 3.8, 6);
    if (has('back')) torso += band(J.H, J.S, 0.35, 0.82, B, 4.6, 6.5);
    if (has('lowback')) torso += band(J.H, J.S, 0.08, 0.38, B, 4, 6);
    if (has('traps')) torso += band(J.H, J.S, 0.82, 1.08, B, 3.6, 6);
    if (has('shoulders') || has('frontdelt') || has('reardelt')) {
      const u = norm([J.S[0] - J.H[0], J.S[1] - J.H[1]]); const fr = [-u[1] * pr, u[0] * pr];
      const o = has('frontdelt') ? 3.5 : has('reardelt') ? -3.5 : 0;
      sh += circ(add(J.S, fr, o), 6.2, 'msc');
    }
    if (has('biceps')) ua += band(J.S, J.E, 0.25, 0.8, 1, 2.8, 2.6);
    if (has('triceps')) ua += band(J.S, J.E, 0.2, 0.82, -1, 2.8, 2.6);
    if (has('quads')) th += band(J.H, J.K, 0.18, 0.86, 1 * pr, 4, 3.4);
    if (has('hams')) th += band(J.H, J.K, 0.15, 0.82, -1 * pr, 4, 3.4);
    if (has('calves')) sn += band(J.K, J.A, 0.1, 0.55, -1 * pr, 3.6, 2.2);
    if (has('glutes')) { const u = norm([J.S[0] - J.H[0], J.S[1] - J.H[1]]); hip += circ(add(J.H, [u[1] * pr, -u[0] * pr], 5), 6, 'msc'); }
    return { torso, ua, th, sn, hip, sh };
  }

  function drawFigure(J, mus) {
    let s = '';
    if (J.view === 'front') {
      const C = J.C, H = J.H;
      const has = m => (mus || []).includes(m);
      const lw = [H[0] - 10, H[1] - 10], rw = [H[0] + 10, H[1] - 10];
      // legs
      s += pth(cap(J.HR, J.K, 7.6, 5.6), 'bd') + pth(cap(J.K, J.A, 5.4, 4), 'bd') + pth(cap(J.A, J.Toe, 3.6, 3), 'bd');
      s += pth(cap(J.HL, J.K2, 7.6, 5.6), 'bd') + pth(cap(J.K2, J.A2, 5.4, 4), 'bd') + pth(cap(J.A2, J.Toe2, 3.6, 3), 'bd');
      if (has('quads') || has('hams')) s += band(J.HR, J.K, 0.18, 0.85, 1, 3.8, 0) + band(J.HL, J.K2, 0.18, 0.85, 1, 3.8, 0);
      if (has('calves')) s += band(J.K, J.A, 0.1, 0.55, 1, 3.2, 0) + band(J.K2, J.A2, 0.1, 0.55, 1, 3.2, 0);
      // torso
      s += `<path class="bd tor" d="M${f(J.S2[0] - 2)} ${f(J.S2[1] - 2)}L${f(J.S[0] + 2)} ${f(J.S[1] - 2)}L${f(rw[0])} ${f(rw[1])}L${f(H[0] + 11)} ${f(H[1] + 2)}L${f(H[0] - 11)} ${f(H[1] + 2)}L${f(lw[0])} ${f(lw[1])}Z"/>`;
      if (has('chest')) s += `<ellipse class="ms" cx="${f(C[0] + 7)}" cy="${f(C[1] + 9)}" rx="7" ry="5"/><ellipse class="ms" cx="${f(C[0] - 7)}" cy="${f(C[1] + 9)}" rx="7" ry="5"/>`;
      if (has('abs')) s += `<rect class="ms" x="${f(C[0] - 6)}" y="${f(C[1] + 18)}" width="12" height="${f(Math.max(6, H[1] - C[1] - 24))}" rx="4"/>`;
      if (has('back')) s += pth(cap([C[0] + 11, C[1] + 8], [H[0] + 8, H[1] - 12], 3.2, 2.4), 'ms') + pth(cap([C[0] - 11, C[1] + 8], [H[0] - 8, H[1] - 12], 3.2, 2.4), 'ms');
      if (has('lowback')) s += `<rect class="ms" x="${f(H[0] - 7)}" y="${f(H[1] - 18)}" width="14" height="12" rx="4"/>`;
      s += pth(cap(C, J.head, 4.2, 4.2), 'bd') + circ(J.head, 10, 'bd');
      if (has('traps')) s += pth(cap([C[0] + 3, C[1] - 4], J.S, 3.4, 3), 'ms') + pth(cap([C[0] - 3, C[1] - 4], J.S2, 3.4, 3), 'ms');
      // arms
      s += pth(cap(J.S, J.E, 5.4, 4.4), 'bd') + pth(cap(J.E, J.W, 4.2, 3.3), 'bd') + circ(J.W, 4, 'bd');
      s += pth(cap(J.S2, J.E2, 5.4, 4.4), 'bd') + pth(cap(J.E2, J.W2, 4.2, 3.3), 'bd') + circ(J.W2, 4, 'bd');
      if (has('biceps') || has('triceps')) s += band(J.S, J.E, 0.22, 0.8, 1, 2.8, 0) + band(J.S2, J.E2, 0.22, 0.8, 1, 2.8, 0);
      if (has('shoulders') || has('frontdelt') || has('reardelt')) s += circ(J.S, 6.4, 'msc') + circ(J.S2, 6.4, 'msc');
      return s;
    }
    const M = muscleSide(J, mus);
    const pr = J.p.prone ? -1 : 1;
    // far limbs
    s += `<g class="far">${pth(cap(J.S, J.E2, 5.2, 4.3), 'bd')}${pth(cap(J.E2, J.W2, 4.2, 3.3), 'bd')}${circ(J.W2, 3.9, 'bd')}${pth(cap(J.H, J.K2, 8, 5.8), 'bd')}${pth(cap(J.K2, J.A2, 5.6, 4), 'bd')}${pth(cap(J.A2, J.Toe2, 3.8, 3.1), 'bd')}</g>`;
    // torso with chest and glute shaping
    const u = norm([J.S[0] - J.H[0], J.S[1] - J.H[1]]); const fr = [-u[1] * pr, u[0] * pr];
    s += pth(cap(add(J.H, u, -2), J.S, 9, 10.2), 'bd');
    s += pth(cap(add(lp(J.H, J.S, 0.5), fr, 3.5), add(lp(J.H, J.S, 0.86), fr, 3.5), 6, 7), 'bd');
    s += circ(add(J.H, fr, -4.5), 7.5, 'bd');
    s += M.torso + M.hip;
    // neck + head (nose shows facing direction)
    const hu = norm([J.head[0] - J.S[0], J.head[1] - J.S[1]]); const hf = [-hu[1] * pr, hu[0] * pr];
    s += pth(cap(J.S, J.head, 4.4, 4.4), 'bd') + circ(J.head, 10, 'bd') + (J.p.nn ? '' : circ(add(J.head, hf, 9.2), 2.8, 'bd'));
    // near leg
    s += pth(cap(J.H, J.K, 8.2, 5.9), 'bd') + M.th + pth(cap(J.K, J.A, 5.7, 4.1), 'bd') + M.sn + pth(cap(J.A, J.Toe, 3.9, 3.2), 'bd');
    // near arm
    s += pth(cap(J.S, J.E, 5.4, 4.5), 'bd') + M.ua + M.sh + pth(cap(J.E, J.W, 4.3, 3.4), 'bd') + circ(J.W, 4, 'bd');
    return s;
  }

  function prop(o, J, J0, J1, q, ph) {

    }
    if (t === 'fpad') { const C = J0.C, H = J0.H; return `<rect class="padf" x="${f(C[0] - 21)}" y="${f(C[1] - 6)}" width="42" height="${f(H[1] - C[1] + 12)}" rx="6"/>`; }
    if (t === 'stack') {

      const pl = 4.2, n = 12, lift = (o.still ? 0 : q) * 14, moving = 4;
      for (let i = 0; i < n; i++) {

        s += `<rect class="${mv ? 'mvf' : 'eqf'}" x="${x + 2}" y="${f(yy - (mv ? lift : 0))}" width="${w - 4}" height="${pl}" rx="1"/>`;
      }

    }
    if (t === 'rail') return ln([o.x1, o.y1], [o.x2, o.y2], o.cls || 'eq');
    if (t === 'lines') return o.d.map(l => ln([l[0], l[1]], [l[2], l[3]], o.cls || 'eq')).join('');

    if (t === 'wall') return ln([o.x, 18], [o.x, GY], 'eq') + `<rect class="wallf" x="${o.x}" y="18" width="12" height="${GY - 18}"/>`;
    if (t === 'block') return `<rect class="eqf" x="${o.x}" y="${o.y}" width="${o.w}" height="${GY - o.y}" rx="1.5"/>`;
    if (t === 'track') {
      const a = J0[o.at || 'W'], b = J1[o.at || 'W'], u = norm([b[0] - a[0], b[1] - a[1]]), e = o.ext ?? 8;
      return ln(add(a, u, -e), add(b, u, e), 'guide');
    }
    if (t === 'handle') { let s = circ(J[o.at || 'W'], 3.6, 'mvf'); if (o.both) s = circ(J[o.at2 || 'W2'], 3.6, 'mvf far2') + s; return s; }
    if (t === 'db') {
      const one = (P, cls) => `<rect class="mvf ${cls}" x="${f(P[0] - 8)}" y="${f(P[1] - 3.6)}" width="16" height="7.2" rx="2.4"/>`;
      return (o.both ? one(J.W2, 'far2') : '') + one(J.W, '');
    }
    if (t === 'plate') { const P = J[o.at || 'W']; return circ(P, o.r || 10, 'plate') + circ(P, 2.2, 'eqf'); }
    if (t === 'lever') {
      const pv = typeof o.pivot === 'string' ? J0[o.pivot] : o.pivot;
      const to = J[o.to || 'W'];
      const end = o.dx || o.dy ? [to[0] + (o.dx || 0), to[1] + (o.dy || 0)] : to;
      let s = ln(pv, end, 'mv') + circ(pv, 3.4, 'eqf');
      if (o.both) s = ln(pv, J[o.to2 || 'W2'], 'mv far2') + s;
      return s;
    }
    if (t === 'cable') {
      let s = ln(o.from, J[o.to || 'W'], 'cb') + circ(o.from, 3.5, 'eqo');
      if (o.from2) s += ln(o.from2, J[o.to2 || 'W2'], 'cb') + circ(o.from2, 3.5, 'eqo');

    }
    if (t === 'pad') {
      const JJ = o.fixed ? J0 : J; const P = JJ[o.at];

    if (t === 'shinpad') {
      const sn = J.p.sn ?? 0; const c = add(J.A, dir(sn + (o.side ?? 90)), 6.5);

  function newDraft(dayId) { draft = { day: dayId, start: null, sets: {}, wu: {}, done: {}, warm: 0, timer: null }; saveDraft(); }
  function markStart() { if (!draft.start) { draft.start = Date.now(); saveDraft(); } keepAwake(); }

  // ---------- audio, wake lock ----------
  let actx = null;
  function unlockAudio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) { actx = null; } }
  function beep(n = 1, f = 880) {
    if (!actx) return;
    try {
      for (let i = 0; i < n; i++) {
        const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * 0.24;
        o.type = 'sine'; o.frequency.value = i === n - 1 && n > 1 ? f * 1.5 : f;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
        o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + 0.22);

    } catch (e) { /* audio unavailable */ }
  }
  let wake = null;
  async function keepAwake() { try { if ('wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) { wake = null; } }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && hasProgress()) keepAwake(); });

  // ---------- UI state ----------
  const ui = { setEdit: null, edit: null, addTo: null, confirmRm: null, dayLog: null, confirmDel: null, view: 'home', day: null, sheet: null, summary: null, confirmDiscard: false, confirmFinish: false, slow: false, navigated: false };
  const ICON = {
    back: '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
    close: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    chev: '<svg viewBox="0 0 24 24" width="20" height="20" style="stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round"><path d="M9 5l7 7-7 7"/></svg>',
    dumb: '<svg viewBox="0 0 24 24"><path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/></svg>',
    chart: '<svg viewBox="0 0 24 24"><path d="M4 19h16M6 15l4-5 4 3 5-7"/></svg>',
    cal: '<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
    play: '<svg viewBox="0 0 24 24" width="16" height="16" style="fill:currentColor"><path d="M8 5l11 7-11 7z"/></svg>',
  };
  const fig = (key, opts = {}) => `<svg class="fig" viewBox="0 0 200 170" data-anim="${key}"${opts.always ? ' data-always' : ''}${opts.ph != null ? ` data-ph="${opts.ph}"` : ''}${opts.slow ? ' data-speed="0.5"' : ''} aria-hidden="true"></svg>`;
  const imgOf = c => (IMG[c.id] ? IMG[c.id][c.alt ? 1 : 0] : null);
  function verbOf(anim) { const i = GymAnim.info(anim); return i.hold ? 'Hold' : i.cont ? 'Keep going' : i.verbs[0]; }
  const photo = (img, verb, cls = '') => img ? `<div class="photo ${cls}"><img src="img/${img}_0.jpg" alt="Start position" decoding="async"><img class="b" src="img/${img}_1.jpg" alt="${esc(verb)} position" decoding="async"><span class="tag ta">1 · Start</span><span class="tag tb">2 · ${esc(verb)}</span></div>` : '';
  const anim3d = c => { const a = ANIM3D[c.id] && ANIM3D[c.id][c.alt ? 1 : 0]; return a ? `https://fitnessprogramer.com/exercise/${a}/` : null; };
  const ytLink = name => `https://www.youtube.com/results?search_query=${encodeURIComponent(name + ' proper form')}`;
  const musChips = key => { const m = GymAnim.info(key).mus; return m.length ? `<div class="mus">${m.map(x => `<span>${MUSCLE[x] || x}</span>`).join('')}</div>` : ''; };

  // ---------- views ----------
  function topBar(back) {
    return `<header class="top">
      ${back ? `<button class="iconbtn" data-act="home" aria-label="Back to workouts">${ICON.back}</button>` : ''}
      <div class="grow"><div class="brand disp">Iron Week</div></div>
      <div id="sync" class="sync ${syncMode}"><i></i><span>${SYNC_TEXT[syncMode]}</span></div>
    </header>`;
  }

  // ---------- plan, forecast, streak ----------
  const ORDER = ['chest', 'back', 'shoulders', 'legs'];
  const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const planDays = () => (prefs.plan && Array.isArray(prefs.plan.days) && prefs.plan.days.length ? prefs.plan.days : [1, 2, 3, 5, 6]);
  const planFixed = () => (prefs.plan && prefs.plan.days ? (prefs.plan.fixed || {}) : { 6: 'cardio' });
  const dayStart = t => { const d = new Date(t); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); };
  const addDays = (t, n) => { const d = new Date(t); return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n).getTime(); };
  const weekStartOf = t => { const d = new Date(t); return new Date(d.getFullYear(), d.getMonth(), d.getDate() - d.getDay()).getTime(); };
  const sessionsOn = t0 => { const t1 = addDays(t0, 1); return hist.sessions.filter(x => x.t >= t0 && x.t < t1); };
  function nextLift() {
    const lifts = hist.sessions.filter(x => ORDER.includes(x.day));
    const last = lifts[lifts.length - 1];
    return last ? ORDER[(ORDER.indexOf(last.day) + 1) % ORDER.length] : 'chest';
  }
  function forecast(n = 70) {
    const out = {}; const pd = planDays(); const fx = planFixed(); let idx = ORDER.indexOf(nextLift());
    let t = dayStart(Date.now());
    if (sessionsOn(t).length) t = addDays(t, 1);
    for (let i = 0; i < n; i++) {
      const dow = new Date(t).getDay();
      if (pd.includes(dow)) { if (fx[dow] && DAY[fx[dow]]) out[t] = fx[dow]; else { out[t] = ORDER[idx]; idx = (idx + 1) % ORDER.length; } }
      t = addDays(t, 1);
    }
    return out;
  }
  function nextPlanned() { const f = forecast(14); const t = Object.keys(f).map(Number).sort((a, b) => a - b)[0]; return t ? { t, day: f[t] } : { t: null, day: nextLift() }; }
  function streakInfo() {
    const goal = planDays().length;
    const counts = {};
    const seen = new Set();
    hist.sessions.forEach(x => { const d = dayStart(x.t); if (seen.has(d)) return; seen.add(d); const w = weekStartOf(x.t); counts[w] = (counts[w] || 0) + 1; });
    const nowW = weekStartOf(Date.now());
    const thisWeek = counts[nowW] || 0;
    const first = hist.sessions.length ? weekStartOf(hist.sessions[0].t) : nowW;
    let streak = thisWeek >= goal ? 1 : 0; let w = addDays(nowW, -7);
    while (w >= first && (counts[w] || 0) >= goal) { streak++; w = addDays(w, -7); }
    let best = 0, run = 0;
    for (let x = first; x <= nowW; x = addDays(x, 7)) {
      if ((counts[x] || 0) >= goal) { run++; best = Math.max(best, run); } else if (x !== nowW) run = 0;
    }
    const last = hist.sessions[hist.sessions.length - 1];
    const since = last ? Math.round((dayStart(Date.now()) - dayStart(last.t)) / 864e5) : null;
    return { goal, thisWeek, streak, best, since, total: seen.size };
  }
  const fmtDay = t => new Date(t).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  function whenText(t) { const today = dayStart(Date.now()); return t === today ? 'Today' : t === addDays(today, 1) ? 'Tomorrow' : fmtDay(t); }

  function nextCard() {
    const today = dayStart(Date.now());
    const done = sessionsOn(today);
    const nx = nextPlanned(); const d = DAY[nx.day];
    let head, sub;
    if (done.length) { head = 'Done today ✓'; sub = done.map(x => DAY[x.day] ? DAY[x.day].name : x.day).join(' + ') + ` · Next: ${nx.t ? whenText(nx.t) : ''} · ${d.name}`; }
    else if (nx.t === today) { head = 'Today: ' + d.name; sub = 'It\'s one of your gym days.'; }
    else { head = 'Rest day'; sub = `Next: ${nx.t ? whenText(nx.t) : 'soon'} · ${d.name}`; }
    return `<button class="todaycard d-${d.color}" data-act="open-day" data-day="${d.id}"><div class="t"><span class="lbl" style="color:inherit;opacity:.85">Next workout</span><b>${esc(head)}</b><span class="sub">${esc(sub)}</span></div><span class="go">${done.length || nx.t !== today ? 'Open' : 'Start'} ›</span></button>`;
  }

  function calendarView() {
    const today = dayStart(Date.now());
    const base = ui.calMonth != null ? ui.calMonth : new Date(new Date().getFullYear(), new Date().getMonth(), 1).getTime();
    const bd = new Date(base); const y = bd.getFullYear(), m = bd.getMonth();
    const f = forecast(120); const pd = planDays();
    const firstSes = hist.sessions.length ? dayStart(hist.sessions[0].t) : null;
    const st = streakInfo();
    let s = topBar(false);
    s += `<section class="intro"><h1 class="disp" style="font-size:44px">Calendar</h1><p>Your workouts, your streak and what to train next.</p></section>`;
    s += nextCard();
    s += `<div class="stats"><div><b class="num">${st.streak}</b><span>Week streak${st.best > st.streak ? ' · best ' + st.best : ''}</span></div><div><b class="num">${st.thisWeek}/${st.goal}</b><span>This week</span></div><div><b class="num">${st.since == null ? '—' : st.since === 0 ? 'Today' : st.since + 'd'}</b><span>${st.since === 0 ? 'Last workout' : 'Since last workout'}</span></div></div>`;

      ${base !== new Date(new Date().getFullYear(), new Date().getMonth(), 1).getTime() ? `<button class="btn" data-act="cal-today" style="min-height:40px">Today</button>` : ''}

    const days = new Date(y, m + 1, 0).getDate();
    for (let dn = 1; dn <= days; dn++) {
      const t = new Date(y, m, dn).getTime();
      const ses = sessionsOn(t);
      const planned = f[t];
      const isPlanDay = pd.includes(new Date(t).getDay());

      let cls = 'cal-cell', inner = `<span class="n num">${dn}</span>`;
      if (ses.length) { const c = DAY[ses[0].day] ? DAY[ses[0].day].color : 'steel'; cls += ` done d-${c}`; inner += `<span class="dots">${ses.map(x => `<i class="d-${DAY[x.day] ? DAY[x.day].color : 'steel'}"></i>`).join('')}</span><span class="tag">${ses.map(x => DAY[x.day] ? DAY[x.day].tag : '').join('+')}</span>`; }
      else if (planned) { cls += ` planned d-${DAY[planned].color}`; inner += `<span class="plan">${DAY[planned].tag}</span>`; }
      else if (missed) { cls += ' miss'; inner += `<span class="x">missed</span>`; }
      if (t === today) cls += ' today';
      s += `<button class="${cls}" data-act="daylog" data-date="${t}" aria-label="${fmtDay(t)}${ses.length ? ': ' + ses.length + ' workout' : planned ? ': planned ' + DAY[planned].name : ''}">${inner}</button>`;
    }

    s += `<section class="pgroup" style="margin-top:12px"><h3>Your gym days</h3><p class="muted" style="margin:0 0 10px;font-size:14px">Pick the days you train. Set a day to a fixed workout (like Saturday for cardio) or leave it on "Next in order" to rotate Chest → Back → Shoulders → Legs. The app counts a week toward your streak when you hit ${st.goal} workout${st.goal > 1 ? 's' : ''}.</p>
      <div class="plan-days" role="group" aria-label="Gym days">${DOW.map((d, i) => `<button data-act="plan-day" data-dow="${i}" aria-pressed="${pd.includes(i)}">${d}</button>`).join('')}</div>
      <div class="planrows">${pd.map(i => `<label class="planrow"><span>${DOW[i]}</span><select id="plan-${i}" data-plan-dow="${i}"><option value="">Next in order</option>${DAYS.map(d => `<option value="${d.id}"${planFixed()[i] === d.id ? ' selected' : ''}>${esc(d.name)}</option>`).join('')}</select></label>`).join('')}</div><div style="height:12px"></div></section>`;
    return s;
  }

  function weekStrip() {

  function exCard(id) {
    const c = cfg(id), e = c.e;
    const done = (draft && draft.sets[id]) || [];
    const ndone = done.filter(Boolean).length;
    const complete = c.kind === 'time' ? !!(draft && draft.done[id]) : ndone >= c.sets;
    const l = logOf(id, c.v).filter(x => (x.k || 'kg') === c.kind), last = l[l.length - 1];
    let hint = '';
    if (c.kind === 'time') hint = esc(c.setting || '');

      </div>
      </div>

      ${ctrl}
    </article>`;
  }

  function editList(key) {
    const list = listFor(key);
    let s = `<p class="muted" style="margin:-4px 0 10px;font-size:13px">${key === 'finisher' ? 'The finisher is shared by all four lifting days. ' : ''}Move, remove or add exercises. Your weights and history are kept.</p><div class="elist">`;
    list.forEach((id, i) => {

  function addExercise(form) {

    else if (kind === 'reps') { ex.type = 'reps'; ex.reps = isNaN(val) ? +f.reps.value : Math.round(val); }
    else if (kind === 'hold') { ex.hold = isNaN(val) ? 30 : Math.round(val); }

  function spark(points, w = 300, h = 64, labels = true, unit = 'kg') {
    if (points.length < 2) return '';
    const vals = points.map(entryVal), mn = Math.min(...vals), mx = Math.max(...vals);
    const pad = labels ? 14 : 3, lo = mn === mx ? mn - 1 : mn, hi = mn === mx ? mx + 1 : mx;
    const X = i => pad + (i / (points.length - 1)) * (w - pad * 2), Y = v => h - 6 - ((v - lo) / (hi - lo)) * (h - 18);
    const line = points.map((p, i) => `${X(i).toFixed(1)},${Y(entryVal(p)).toFixed(1)}`).join(' ');
    let s = `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">`;
    if (labels) s += `<line class="grid" x1="${pad}" x2="${w - pad}" y1="${Y(lo).toFixed(1)}" y2="${Y(lo).toFixed(1)}"/>`;
    s += `<polygon class="ar" points="${X(0)},${h} ${line} ${X(points.length - 1)},${h}"/><polyline class="ln" points="${line}"/><circle class="dot" cx="${X(points.length - 1).toFixed(1)}" cy="${Y(vals[vals.length - 1]).toFixed(1)}" r="3.5"/>`;
    if (labels) s += `<text x="${pad}" y="${h - 1}">${fmtW(vals[0])} ${unit}</text><text x="${w - pad}" y="10" text-anchor="end">${fmtW(vals[vals.length - 1])} ${unit}</text>`;
    return s + '</svg>';
  }

  function allIds() { return [...new Set([...DAYS.flatMap(d => listFor(d.id)), ...listFor('finisher')])]; }
  function weeklyRecap(wkStart) {
    const lastWk = addDays(wkStart, -7);
    const volOf = (a, b) => hist.sessions.filter(x => x.t >= a && x.t < b).reduce((t, x) => t + (x.vol || 0), 0);
    const vNow = volOf(wkStart, addDays(wkStart, 7)), vPrev = volOf(lastWk, wkStart);
    const st = streakInfo();
    const up = [], stall = [];
    allIds().forEach(id => {
      const c = cfg(id); if (c.kind === 'time') return;
      const l = logOf(id, c.v).filter(x => (x.k || 'kg') === c.kind);
      if (!l.length) return;
      const last = l[l.length - 1], prev = l[l.length - 2];
      if (last.t >= wkStart && prev && better(c.assist, topOf(last), topOf(prev))) up.push(`${c.name} ${fmtW(topOf(prev))}→${fmtW(topOf(last))}`);
      const l3 = l.slice(-3);
      if (l3.length === 3 && l3.every(x => r1(topOf(x)) === r1(topOf(l3[0]))) && l3[2].t - l3[0].t >= 14 * 864e5) stall.push(c.name);
    });
    const diff = vPrev ? Math.round((vNow - vPrev) / vPrev * 100) : null;
    let s = `<section class="pgroup recap"><h3>This week</h3>
      <div class="rgrid"><div><span class="lbl">Workouts</span><b class="num">${st.thisWeek}/${st.goal}</b></div><div><span class="lbl">Total lifted</span><b class="num">${vNow ? vNow.toLocaleString('en-US') + ' kg' : '—'}</b>${diff != null && vNow ? `<small class="${diff >= 0 ? 'g' : 'muted'}">${diff >= 0 ? '+' : ''}${diff}% vs last week</small>` : ''}</div></div>`;
    s += `<div class="rrow2"><span class="lbl">Went up</span><span>${up.length ? up.map(esc).join(' · ') : '<span class="muted">Nothing yet this week</span>'}</span></div>`;
    s += `<div class="rrow2"><span class="lbl">Stuck 3+ sessions</span><span>${stall.length ? stall.map(esc).join(' · ') + '<br><small class="muted">Try one more rep each set, or drop the weight 10% and build back.</small>' : '<span class="muted">None</span>'}</span></div></section>`;
    return s;
  }
  function bodySection() {
    const B = hist.body || [];
    const last = B[B.length - 1], first = B[0];
    let s = `<section class="pgroup"><h3>Body weight</h3>`;
    s += `<form id="bwform" class="bwform"><input id="bw-in" name="kg" type="number" inputmode="decimal" step="0.1" min="20" max="400" placeholder="${last ? fmtW(last.kg) : 'e.g. 82.5'}" aria-label="Body weight in kg"><span class="muted">kg</span><button class="btn ink" type="submit">Log today</button></form>`;
    if (B.length > 1) s += spark(B.slice(-30).map(x => ({ w: x.kg })), 300, 64, true, 'kg');
    if (last) s += `<p class="muted" style="margin:6px 0 0;font-size:14px">Now <b style="color:var(--ink)">${fmtW(last.kg)} kg</b>${B.length > 1 ? ` · ${last.kg - first.kg >= 0 ? '+' : ''}${fmtW(last.kg - first.kg)} kg since ${fmtD(first.t)}` : ''}</p>`;
    const H = prefs.height;
    if (H) {
      const m = H / 100, lo = r1(18.5 * m * m), hi = r1(24.9 * m * m);
      if (last) {
        const bmi = Math.round(last.kg / (m * m) * 10) / 10;
        const cat = bmi < 18.5 ? 'Under' : bmi < 25 ? 'Healthy' : bmi < 30 ? 'Over' : 'High';
        s += `<div class="bmi"><div><span class="lbl">BMI</span><b class="num">${bmi}</b><span class="bmicat c-${cat.toLowerCase()}">${cat === 'Under' ? 'Underweight' : cat === 'Healthy' ? 'Healthy range' : cat === 'Over' ? 'Overweight range' : 'Obese range'}</span></div><div><span class="lbl">Healthy range at ${H} cm</span><b class="num">${fmtW(lo)}–${fmtW(hi)} kg</b></div></div>
          <p class="muted" style="margin:4px 0 0;font-size:12px">BMI doesn't separate muscle from fat, so it reads high for people who lift. Use it with your waist size and how your clothes fit.</p>`;
      } else s += `<p class="muted" style="margin:6px 0 0;font-size:14px">Healthy BMI range at ${H} cm: <b style="color:var(--ink)">${fmtW(lo)}–${fmtW(hi)} kg</b></p>`;
    }
    s += `<form id="htform" class="bwform htform"><span class="lbl">Height</span><input id="ht-in" name="cm" type="number" inputmode="numeric" min="120" max="230" value="${H || ''}" placeholder="cm" aria-label="Height in cm"><span class="muted">cm</span><button class="btn" type="submit">Save</button></form>`;
    if (B.length) s += `<ul class="histlist">${B.slice(-5).reverse().map(x => `<li style="align-items:center"><span>${fmtD(x.t)}</span><span class="num">${fmtW(x.kg)} kg <button class="xbtn" data-act="bw-del" data-t="${x.t}" aria-label="Delete ${fmtD(x.t)} entry">✕</button></span></li>`).join('')}</ul>`;
    else s += `<p class="empty">Log your weight about once a week, same time of day.</p>`;
    return s + `</section>`;
  }
  function recordsSection() {
    const rows = [];
    allIds().forEach(id => {
      const c = cfg(id); if (c.kind === 'time') return;
      ['m', 'a'].forEach(v => {
        const l = (hist.log[id] || []).filter(x => x.v === v && (x.k || 'kg') !== 'time');
        if (!l.length) return;
        let best = null, at = 0, k = l[0].k || 'kg';
        l.forEach(x => { const tv = topOf(x); if (tv != null && (best == null || better(!!x.a, tv, best))) { best = tv; at = x.t; } });
        if (best == null || (k === 'kg' && !best)) return;
        const e = getEx(id), p = prefs.ex[id] || {};
        rows.push({ name: v === 'a' && e.alt ? (p.aname || e.alt.name) : (p.name || e.name), best, at, k, id });
      });
    });
    rows.sort((a, b) => b.at - a.at);
    let s = `<section class="pgroup"><h3>Personal records</h3>`;
    s += rows.length ? `<ul class="histlist">${rows.slice(0, 12).map(r => `<li><span><span class="star">★</span> ${esc(r.name)}</span><span class="num"><b>${fmtW(r.best)} ${shortU(r.k)}</b> <small class="muted">${fmtD(r.at)}</small></span></li>`).join('')}</ul>` : `<p class="empty">Your best lifts show up here after your first workouts.</p>`;
    return s + `</section>`;

  function progressView() {
    let s = topBar(false);
    const now = new Date();
    const wkStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay()).getTime();
    const moStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
    const S = hist.sessions;

    s += `<div class="stats"><div><b class="num">${S.filter(x => x.t >= wkStart).length}</b><span>This week</span></div><div><b class="num">${S.filter(x => x.t >= moStart).length}</b><span>This month</span></div><div><b class="num">${S.length}</b><span>All time</span></div></div>`;
    s += weeklyRecap(wkStart) + bodySection() + recordsSection();
    const group = (title, color, ids) => {
      let g = `<section class="pgroup d-${color}"><h3><i></i>${esc(title)}</h3>`;

          g += `<button class="prow" data-act="sheet" data-id="${id}"><span class="n">${name}<small>${l.length ? l.length + ' sessions' : 'No sessions yet'}</small></span><span></span><span class="w num">${tot} min<small class="muted">total</small></span></button>`;
          return;
        }
        const l = logOf(id, 'm').filter(x => (x.k || 'kg') === k);
        const cur = k === 'kg' ? (p.w ?? e.w) : k === 'reps' ? (p.reps ?? e.reps ?? 12) : (p.hold ?? e.hold);
        const first = l[0]; const diff = first ? r1(cur - entryVal(first)) : 0;
        const good = (diff > 0) !== !!e.assist;
        const dtxt = !first ? '<small class="muted">start</small>' : diff === 0 ? '<small class="muted">no change</small>' : `<small class="${good ? 'g' : 'muted'}">${diff > 0 ? '+' : ''}${fmtW(diff)} ${shortU(k)}</small>`;
        g += `<button class="prow" data-act="sheet" data-id="${id}"><span class="n">${name}<small>${l.length ? l.length + ' logged · last ' + fmtD(l[l.length - 1].t) : 'Not logged yet'}</small></span>
          <span>${l.length > 1 ? spark(l.slice(-20), 92, 30, false) : ''}</span><span class="w num">${fmtW(cur)} ${shortU(k)}${dtxt}</span></button>`;
      });
      return g + '</section>';
    };
    if (S.length) {
      s += `<section class="pgroup"><h3>Recent workouts</h3>` + S.slice(-8).reverse().map(x => {
        const d = DAY[x.day];

      }).join('') + `</section>`;

    DAYS.forEach(d => { s += group(d.name, d.color, listFor(d.id)); });
    s += group('Finisher', 'steel', listFor('finisher'));
    s += `<section class="pgroup"><h3>Backup</h3><p class="muted" style="margin:0 0 10px;font-size:14px">Everything saves to your account by itself. For extra safety, keep a backup file in your Files app and restore it any time.</p>
      <div class="row" style="padding-bottom:10px"><button class="btn ink" data-act="backup">Save backup file</button><label class="btn" for="restore-file">Restore from file</label><input id="restore-file" type="file" accept=".json,application/json" hidden></div>
      <p class="muted" style="font-size:12px;margin:0 0 12px">Last workout saved: ${S.length ? fmtD(S[S.length - 1].t) : 'none yet'}</p></section>`;
    return s;
  }

      ${anim3d(c) ? `<a class="btn primary" href="${anim3d(c)}" target="_blank" rel="noopener">▶ 3D animation</a>` : ''}<a class="btn" href="${ytLink(c.name)}" target="_blank" rel="noopener">▶ Video</a></div>
      ${musChips(c.anim).replace('class="mus"', 'class="mus" style="margin-top:12px"')}
      ${GymAnim.info(c.anim).cont || GymAnim.info(c.anim).hold ? '' : `<div class="frames"><figure>${fig(c.anim, { ph: 0 })}<figcaption>1 · Start</figcaption></figure><figure>${fig(c.anim, { ph: 0.4 })}<figcaption>2 · ${esc(verbOf(c.anim))}</figcaption></figure></div>`}`;
    s += `<div class="sec"><h3>How to</h3></div><ol class="cues">${c.cues.map(x => `<li>${esc(x)}</li>`).join('')}</ol>`;
    if (c.kind === 'time') {
      s += `<div class="sec"><h3>Settings</h3><span class="lbl">Saved automatically</span></div>${c.setting ? `<p class="muted" style="margin:0 0 8px">${esc(c.setting)}</p>` : ''}
      <div class="fields"><label class="full">Name<input id="f-name" data-field="name" data-id="${id}" type="text" value="${esc(c.name)}" autocomplete="off"></label>
      <label class="full">Animation<select id="f-anim" data-field="anim" data-id="${id}">${animOptions(c.anim)}</select></label>
      <label class="full">Notes<textarea id="f-memo" data-field="memo" data-id="${id}" rows="2" placeholder="Level, speed, how it felt…">${esc((prefs.ex[id] || {}).memo || '')}</textarea></label></div>`;
      const l = hist.log[id] || [];
      s += `<div class="sec"><h3>History</h3></div>` + (l.length ? `<ul class="histlist">${l.slice(-8).reverse().map(x => `<li><span>${fmtD(x.t)}</span><span class="num">${x.m} min · ${x.v === 'a' && e.alt ? esc(e.alt.name) : esc(e.name)}</span></li>`).join('')}</ul>` : '<p class="empty">Nothing logged yet.</p>');
    } else {
      s += `<div class="sec"><h3>Settings</h3><span class="lbl">Saved automatically</span></div>
      <div class="fields">
        <label>Sets<select id="f-sets" data-field="sets" data-id="${id}">${opts([1, 2, 3, 4, 5, 6], c.sets)}</select></label>
        <label>Rest<select id="f-rest" data-field="rest" data-id="${id}">${opts([30, 45, 60, 75, 90, 120, 150, 180], c.rest, v => v + ' s')}</select></label>
        ${c.kind === 'kg' ? `<label>Reps<select id="f-reps" data-field="reps" data-id="${id}">${opts([5, 6, 8, 10, 12, 15, 20, 25], c.reps)}</select></label>
        <label>Weight step<select id="f-step" data-field="step" data-id="${id}">${opts([0.5, 1, 2, 2.5, 5], c.step, v => v + ' kg')}</select></label>` : ''}
        <label class="full">Name${e.alt ? ' for this version' : ''}<input id="f-name" data-field="name" data-id="${id}" type="text" value="${esc(c.name)}" autocomplete="off"></label>
        <label class="full">Animation<select id="f-anim" data-field="anim" data-id="${id}">${animOptions(c.anim)}</select></label>
        <label class="full">Notes<textarea id="f-memo" data-field="memo" data-id="${id}" rows="2" placeholder="Seat height, handle position, how it felt…">${esc((prefs.ex[id] || {}).memo || '')}</textarea></label>
      </div>`;
      const pts = logOf(id, c.v).filter(x => (x.k || 'kg') === c.kind && entryVal(x) != null);
      s += `<div class="sec"><h3>History</h3><span class="lbl">${esc(c.alt ? 'This version' : 'Main version')}</span></div>`;
      s += pts.length > 1 ? spark(pts.slice(-30), 300, 64, true, shortU(c.kind)) : '';
      const best = pts.length ? pts.reduce((b, x) => (b == null || better(c.assist, topOf(x), b) ? topOf(x) : b), null) : null;
      if (best != null) s += `<p class="best">★ Best: <b>${fmtW(best)} ${shortU(c.kind)}</b></p>`;
      s += pts.length ? `<ul class="histlist">${pts.slice(-8).reverse().map(x => `<li><span>${fmtD(x.t)}</span><span class="num">${entrySetsTxt(x) ? esc(entrySetsTxt(x)) : fmtW(entryVal(x)) + ' ' + shortU(c.kind) + ' · ' + x.d + '/' + x.n + ' sets'}</span></li>`).join('')}</ul>` : '<p class="empty">Finish a workout with this exercise and your numbers show up here.</p>';
    }
    const k = keyOfEx(id);
    if (k) s += `<div style="margin-top:14px">${ui.confirmRm === id ? `<div class="blocker"><p>Remove <b>${esc(c.name)}</b> from ${esc(k === 'finisher' ? 'the finisher' : DAY[k].name)}? Its history is kept and you can add it back from Edit.</p><div class="row"><button class="btn" style="color:var(--red)" data-act="ex-remove-yes" data-key="${k}" data-id="${id}">Remove</button><button class="btn" data-act="ex-remove-no">Keep</button></div></div>` : `<button class="btn wide" style="color:var(--red)" data-act="ex-remove" data-id="${id}">Remove from workout</button>`}</div>`;
    s += `<div style="margin-top:10px"><button class="btn ink wide" data-act="close">Done</button></div></div></div>`;
    return s;
  }

  function setEditHTML() {
    const { id, i } = ui.setEdit; const c = cfg(id);
    const arr = (draft && draft.sets[id]) || []; const x = setVal(c, arr[i]);
    if (!x) { ui.setEdit = null; return ''; }
    const box = (label, val, unit, a) => `<div class="sebox"><span class="lbl">${label}</span><div class="wt"><button data-act="${a}-" aria-label="Less ${label}">−</button><div class="v"><b class="num">${val}</b><small>${unit}</small></div><button data-act="${a}+" aria-label="More ${label}">+</button></div></div>`;
    let s = `<div class="overlay" data-act="close-bg"><div class="sheet d-${colorOf(id)}" role="dialog" aria-modal="true" aria-label="Edit set"><div class="grab"></div>
      <div class="hd"><div class="grow"><div class="lbl">${esc(c.name)}</div><h2>Set ${i + 1}</h2></div><button class="iconbtn" data-act="close" aria-label="Close">${ICON.close}</button></div>
      <p class="muted" style="margin:8px 0 12px">Change what you actually did in this set.</p><div class="seboxes">`;
    if (c.kind === 'kg') s += box('Weight', fmtW(x.w), c.each ? 'kg each' : 'kg', 'se-w') + box('Reps', x.r, 'reps', 'se-r');
    else if (c.kind === 'reps') s += box('Reps', x.r, 'reps', 'se-r');
